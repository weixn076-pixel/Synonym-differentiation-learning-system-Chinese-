<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f5">
  <link rel="icon" href="data:,">
  <link rel="preload" href="./dictionary_index.json" as="fetch" type="application/json" crossorigin="anonymous">
  <title>词间 - 近义词辨析</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f2;
      --surface: #ffffff;
      --surface-soft: #f8f9f6;
      --surface-strong: #eef2ec;
      --ink: #18211d;
      --muted: #66706a;
      --faint: #929a95;
      --line: #dce2dd;
      --line-strong: #c7d0c9;
      --green: #1f6b4f;
      --green-soft: #e3f0e9;
      --red: #b9473f;
      --red-soft: #f8e9e7;
      --blue: #315f8c;
      --blue-soft: #e8eff6;
      --amber: #a96718;
      --amber-soft: #f7eddd;
      --shadow: 0 8px 24px rgba(24, 33, 29, .07);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      letter-spacing: 0;
      line-height: 1.6;
    }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    .icon { width: 20px; height: 20px; display: block; stroke-width: 1.9; }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      grid-template-rows: 70px minmax(0, 1fr);
      height: 100dvh;
      min-height: 620px;
    }

    .rail {
      grid-column: 1 / -1;
      grid-row: 1;
      min-width: 0;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: #edf1ec;
      position: relative;
      display: grid;
      grid-template-columns: minmax(130px, 1fr) auto minmax(170px, 1fr);
      align-items: center;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0;
      flex: 0 0 auto;
      padding: 0;
    }
    .brand-logo { display: block; width: 116px; height: auto; }

    .rail-nav { min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .nav-button {
      min-height: 40px;
      padding: 0 11px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .nav-button:hover { background: rgba(255,255,255,.7); color: var(--ink); }
    .nav-button.active { background: var(--surface); color: var(--green); box-shadow: 0 2px 10px rgba(24,33,29,.06); }
    .nav-button[hidden] { display: none; }
    .account-area { min-width: 0; justify-self: end; display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
    .account-button { min-height: 36px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 650; cursor: pointer; }
    .account-button.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .account-user { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: 12px; font-weight: 700; }
    .mobile-account { display: none; }

    .library-panel {
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }
    .library-header { padding: 22px 18px 14px; border-bottom: 1px solid var(--line); }
    .library-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .library-title-row h1 { margin: 0; font-size: 18px; line-height: 1.3; }
    .library-total { color: var(--faint); font-size: 12px; }
    .search-wrap { position: relative; }
    .search-wrap .icon { position: absolute; left: 12px; top: 50%; width: 17px; height: 17px; color: var(--faint); transform: translateY(-50%); }
    .search-input {
      width: 100%; height: 42px; padding: 0 36px 0 38px;
      border: 1px solid var(--line); border-radius: 7px; outline: 0;
      background: var(--surface-soft); color: var(--ink); font-size: 14px;
    }
    .search-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,107,79,.1); background: #fff; }
    .clear-search {
      position: absolute; right: 8px; top: 50%; width: 27px; height: 27px; padding: 0;
      border: 0; border-radius: 50%; background: transparent; color: var(--faint);
      display: none; place-items: center; cursor: pointer; transform: translateY(-50%);
    }
    .clear-search.show { display: grid; }
    .clear-search .icon { position: static; width: 16px; height: 16px; transform: none; }

    .filter-row { display: flex; gap: 7px; padding: 12px 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex: 0 0 auto; height: 31px; padding: 0 12px; border: 1px solid var(--line); border-radius: 16px;
      background: #fff; color: var(--muted); font-size: 12px; cursor: pointer;
    }
    .filter-chip.active { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }

    .word-list {
      flex: 1 1 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 7px 8px 16px;
    }
    .word-list::-webkit-scrollbar, .content-scroll::-webkit-scrollbar { width: 8px; }
    .word-list::-webkit-scrollbar-thumb, .content-scroll::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 8px; background: #cfd6d0; background-clip: padding-box; }
    .word-item {
      width: 100%; height: 54px; padding: 9px 12px; border: 0; border-radius: 7px; background: transparent;
      display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px;
      text-align: left; cursor: pointer;
    }
    .word-item:hover { background: var(--surface-soft); }
    .word-item.active { background: var(--green-soft); }
    .word-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 650; }
    .word-state { display: flex; align-items: center; gap: 5px; }
    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
    .state-dot.mastered { background: var(--green); }
    .mini-star { width: 15px; height: 15px; color: var(--amber); fill: currentColor; }
    .list-empty { padding: 48px 24px; color: var(--muted); text-align: center; font-size: 14px; }

    .workspace { grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; }
    .mobile-topbar { display: none; }
    .workspace-toolbar {
      height: 66px; flex: 0 0 66px; padding: 0 28px; border-bottom: 1px solid var(--line);
      background: rgba(243,245,242,.94); display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .breadcrumbs { min-width: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .breadcrumbs strong { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .toolbar-actions.is-hidden { display: none; }
    .icon-button {
      width: 38px; height: 38px; padding: 0; border: 1px solid var(--line); border-radius: 7px;
      background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer;
    }
    .icon-button:hover { border-color: var(--line-strong); color: var(--ink); }
    .icon-button.active { border-color: #e4bd80; background: var(--amber-soft); color: var(--amber); }
    .icon-button.active .star-icon { fill: currentColor; }
    .master-button {
      min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 7px;
      background: var(--surface); color: var(--muted); display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .master-button.active { border-color: rgba(31,107,79,.35); background: var(--green-soft); color: var(--green); }

    .content-scroll {
      flex: 1 1 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scroll-behavior: smooth;
    }
    .detail-view { max-width: 1100px; margin: 0 auto; padding: 30px 34px 80px; }
    .word-hero { padding: 2px 0 24px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 7px; color: var(--green); font-size: 12px; font-weight: 700; }
    .word-title { margin: 0; font-family: "Songti SC", "SimSun", serif; font-size: clamp(34px, 4vw, 54px); line-height: 1.16; font-weight: 700; }
    .word-pinyin { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .word-category { display: inline-flex; margin-top: 13px; padding: 4px 9px; border-radius: 4px; background: var(--surface-strong); color: var(--muted); font-size: 11px; }

    .jump-tabs {
      position: sticky; top: 0; z-index: 10; margin: 0 -34px 24px; padding: 10px 34px;
      border-bottom: 1px solid var(--line); background: rgba(243,245,242,.96);
      display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    }
    .jump-tabs::-webkit-scrollbar { display: none; }
    .jump-tab { flex: 0 0 auto; height: 34px; padding: 0 13px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .jump-tab:hover, .jump-tab.active { background: var(--surface); color: var(--green); }

    .content-section { scroll-margin-top: 62px; padding: 8px 0 32px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .section-heading h2 { margin: 0; font-size: 18px; line-height: 1.3; }
    .section-surface { padding: 21px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .common-copy { margin: 0; white-space: pre-line; color: var(--muted); font-size: 14px; }
    .common-examples { display: grid; gap: 8px; margin-top: 17px; }
    .example-line { position: relative; margin: 0; padding-left: 17px; color: var(--ink); font-size: 14px; }
    .example-line::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    .contrast-grid { display: grid; grid-template-columns: repeat(var(--contrast-columns, 2), minmax(0, 1fr)); gap: 14px; }
    .contrast-card { min-width: 0; padding: 19px; border: 1px solid var(--line); border-top: 3px solid var(--accent, var(--green)); border-radius: 7px; background: var(--surface); }
    .contrast-card:nth-child(2) { --accent: var(--blue); }
    .contrast-card:nth-child(3) { --accent: var(--amber); }
    .contrast-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .contrast-word { margin: 0; font-family: "Songti SC", "SimSun", serif; font-size: 25px; line-height: 1.2; }
    .contrast-order { color: var(--faint); font-size: 10px; }
    .contrast-meaning { margin: 0; white-space: pre-line; color: var(--muted); font-size: 13px; }
    .contrast-examples { margin: 17px 0 0; padding: 13px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 7px; }
    .contrast-example { margin: 0; color: var(--ink); font-size: 13px; }

    .collocation-stack { display: grid; gap: 12px; }
    .collocation-row {
      min-width: 0; padding: 15px 16px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
      display: grid; grid-template-columns: minmax(76px, 110px) minmax(0, 1fr); gap: 13px; align-items: start;
    }
    .collocation-label { padding-top: 5px; font-family: "Songti SC", "SimSun", serif; font-size: 18px; font-weight: 700; }
    .phrase-grid { min-width: 0; display: flex; flex-wrap: wrap; gap: 7px; }
    .phrase-chip {
      max-width: 100%; min-height: 31px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 5px;
      background: var(--surface-soft); color: var(--muted); font-size: 12px; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .collocation-empty { padding: 18px; border: 1px dashed var(--line-strong); border-radius: 7px; color: var(--muted); text-align: center; font-size: 13px; }

    .quiz-list { display: grid; gap: 12px; }
    .quiz-card { padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .quiz-card.answered-correct { border-color: rgba(31,107,79,.34); }
    .quiz-card.answered-wrong { border-color: rgba(185,71,63,.35); }
    .quiz-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .quiz-number { color: var(--green); font-size: 11px; font-weight: 700; }
    .quiz-status { color: var(--faint); font-size: 11px; }
    .quiz-question { margin: 0 0 16px; font-size: 16px; font-weight: 600; line-height: 1.75; }
    .answer-sequence { margin: -3px 0 14px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .answer-sequence[hidden] { display: none; }
    .answer-sequence-label { color: var(--faint); font-size: 11px; }
    .answer-slot {
      min-width: 62px; min-height: 29px; padding: 4px 8px; border: 1px dashed var(--line-strong); border-radius: 5px;
      background: var(--surface-soft); color: var(--faint); display: inline-grid; place-items: center; font-size: 11px;
    }
    .answer-slot.active { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .answer-slot.filled { border-style: solid; color: var(--ink); }
    .answer-slot.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .answer-slot.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .reset-answer { min-height: 29px; padding: 3px 8px; border: 0; background: transparent; color: var(--green); font-size: 11px; cursor: pointer; }
    .reset-answer[hidden] { display: none; }
    .quiz-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .quiz-option {
      min-width: 92px; min-height: 39px; padding: 7px 15px; border: 1px solid var(--line-strong); border-radius: 6px;
      background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .quiz-option:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
    .quiz-option:disabled { cursor: default; }
    .quiz-option.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .quiz-option.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .quiz-answer { display: none; margin-top: 15px; padding: 13px 15px; border-radius: 6px; background: var(--surface-soft); color: var(--muted); font-size: 12px; }
    .quiz-answer.show { display: block; }
    .quiz-answer strong { color: var(--ink); }

    .practice-view, .saved-view, .ai-view, .admin-view { max-width: 980px; margin: 0 auto; padding: 30px 34px 100px; }
    .view-header { margin-bottom: 22px; }
    .view-header h1 { margin: 0; font-size: 27px; }
    .view-header p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .practice-filter { display: flex; gap: 7px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
    .practice-set { display: grid; gap: 12px; }
    .practice-card { padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .practice-source { margin-bottom: 7px; color: var(--green); font-size: 11px; font-weight: 700; }
    .practice-progress { margin-bottom: 18px; color: var(--faint); font-size: 11px; }
    .practice-question { margin: 0 0 18px; font-size: 17px; line-height: 1.75; }
    .practice-set-actions { margin-top: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: var(--shadow); }
    .practice-set-meta { color: var(--muted); font-size: 12px; }
    .text-button { min-height: 39px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .text-button.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .text-button:disabled { opacity: .45; cursor: default; }
    .ai-form { padding: 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .ai-field { display: grid; gap: 7px; margin-bottom: 16px; }
    .ai-field label { font-size: 12px; font-weight: 700; }
    .ai-input, .ai-textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; outline: 0; background: var(--surface-soft); color: var(--ink); font-size: 14px; }
    .ai-input { height: 44px; padding: 0 12px; }
    .ai-textarea { min-height: 100px; padding: 11px 12px; resize: vertical; line-height: 1.7; }
    .ai-input:focus, .ai-textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,107,79,.1); background: #fff; }
    .ai-form-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .ai-hint { color: var(--faint); font-size: 11px; }
    .ai-submit { min-height: 42px; padding: 0 16px; border: 1px solid var(--green); border-radius: 7px; background: var(--green); color: #fff; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .ai-submit:disabled { opacity: .58; cursor: wait; }
    .ai-result { margin-top: 18px; padding: 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .ai-result h2 { margin: 0 0 13px; font-size: 18px; }
    .ai-result-copy { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); font-size: 14px; line-height: 1.9; }
    .ai-error { border-color: rgba(185,71,63,.35); background: var(--red-soft); }
    .admin-controls { margin-bottom: 22px; padding: 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .admin-form { display: grid; grid-template-columns: 120px 120px minmax(180px,1fr) auto; align-items: end; gap: 12px; }
    .admin-field { min-width: 0; display: grid; gap: 7px; }
    .admin-field label { font-size: 12px; font-weight: 700; }
    .admin-input { width: 100%; height: 42px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 7px; outline: 0; background: var(--surface-soft); font-size: 14px; }
    .admin-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,107,79,.1); background: #fff; }
    .admin-submit { min-height: 42px; padding: 0 15px; border: 1px solid var(--green); border-radius: 7px; background: var(--green); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .admin-submit:disabled { opacity: .58; cursor: wait; }
    .generated-batch { margin-bottom: 22px; padding: 18px; border: 1px solid rgba(31,107,79,.32); border-radius: 8px; background: var(--green-soft); }
    .generated-head, .invite-list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .generated-head h2, .invite-list-head h2 { margin: 0; font-size: 17px; }
    .generated-codes { margin-top: 13px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .generated-code { min-width: 0; min-height: 40px; padding: 7px 10px; border: 1px solid rgba(31,107,79,.24); border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .generated-code code { min-width: 0; overflow-wrap: anywhere; color: var(--ink); font-size: 13px; }
    .mini-icon-button { width: 30px; height: 30px; flex: 0 0 30px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
    .mini-icon-button:hover { background: var(--surface-strong); color: var(--green); }
    .invite-summary { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .invite-list { margin-top: 12px; border-top: 1px solid var(--line); }
    .invite-row { min-height: 62px; padding: 11px 4px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 82px minmax(130px,1fr) 130px 130px auto; align-items: center; gap: 12px; }
    .invite-status { width: fit-content; padding: 4px 8px; border-radius: 5px; background: var(--surface-strong); color: var(--muted); font-size: 11px; font-weight: 700; }
    .invite-status.active { background: var(--green-soft); color: var(--green); }
    .invite-status.revoked, .invite-status.expired { background: var(--red-soft); color: var(--red); }
    .invite-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .invite-meta { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .invite-action { min-width: 56px; min-height: 32px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; color: var(--muted); font-size: 11px; cursor: pointer; }
    .invite-action:hover { border-color: var(--red); color: var(--red); }
    .saved-list { display: grid; gap: 9px; }
    .saved-item { padding: 16px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
    .saved-item:hover { border-color: var(--green); }
    .saved-item h3 { margin: 0; font-size: 16px; }

    .auth-modal { position: fixed; inset: 0; z-index: 120; padding: 18px; background: rgba(24,33,29,.38); display: none; place-items: center; }

    .auth-dialog { width: min(420px, 100%); max-height: calc(100dvh - 36px); overflow-y: auto; padding: 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 18px 50px rgba(24,33,29,.2); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; z-index: 100; left: 50%; bottom: 28px; max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 6px; background: #18211d; color: #fff; font-size: 12px; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .2s ease, transform .2s ease; }

    @media (max-width: 1120px) {

  <script>
    const STORAGE = {
      mastered: 'synonym_v2_mastered',
      saved: 'synonym_v2_saved',
      wrong: 'synonym_v2_wrong'
    };
    const state = {
      data: [],
      selectedId: null,
      filter: 'all',
      query: '',
      view: 'library',
      mastered: new Set(readList(STORAGE.mastered)),
      saved: new Set(readList(STORAGE.saved)),
      wrong: new Set(readList(STORAGE.wrong)),
      practicePool: [],
      practicePage: 0,
      practiceFilter: 'all',
      user: null,
      adminInvites: [],
      generatedCodes: [],
      dictionaryReady: false,
      guestAiUsed: false,
      authMode: 'login',
      pendingView: null,
      syncTimer: null
    };

    const els = {
      wordList: document.getElementById('wordList'),
      searchInput: document.getElementById('searchInput'),
      clearSearch: document.getElementById('clearSearch'),
      content: document.getElementById('contentScroll'),
      loading: document.getElementById('loadingScreen'),
      crumb: document.getElementById('crumbTitle'),
      mobileTitle: document.getElementById('mobileTitle'),
      starButton: document.getElementById('starButton'),
      mobileStar: document.getElementById('mobileStar'),
      masterButton: document.getElementById('masterButton'),
      toast: document.getElementById('toast'),
      authModal: document.getElementById('authModal'),
      authForm: document.getElementById('authForm'),
      authMessage: document.getElementById('authMessage')
    };

    function readList(key) {
      try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
    }
    function saveState() {
      localStorage.setItem(STORAGE.mastered, JSON.stringify([...state.mastered]));
      localStorage.setItem(STORAGE.saved, JSON.stringify([...state.saved]));
      localStorage.setItem(STORAGE.wrong, JSON.stringify([...state.wrong]));
      scheduleProgressSync();
    }
    function progressPayload() {
      return {mastered: [...state.mastered], saved: [...state.saved], wrong: [...state.wrong]};
    }
    function applyProgress(progress) {
      state.mastered = new Set(progress?.mastered || []);
      state.saved = new Set(progress?.saved || []);
      state.wrong = new Set(progress?.wrong || []);
      localStorage.setItem(STORAGE.mastered, JSON.stringify([...state.mastered]));
      localStorage.setItem(STORAGE.saved, JSON.stringify([...state.saved]));
      localStorage.setItem(STORAGE.wrong, JSON.stringify([...state.wrong]));
      updateStats(); renderWordList();
      if (state.view === 'saved') renderSaved();
      else if (state.view === 'library' || state.view === 'detail') renderDetail();
    }
    function scheduleProgressSync() {
      if (!state.user) return;
      clearTimeout(state.syncTimer);
      state.syncTimer = setTimeout(async () => {
        try {
          const response = await fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(progressPayload())});
          if (response.status === 401) { state.user = null; renderAccountAreas(); }
        } catch {}
      }, 350);
    }
    async function recordAttempt(itemId, quizIndex, selections, correct) {
      if (!state.user) return;
      try {
        await fetch('/api/attempts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({itemId, quizIndex, selections, correct})});
      } catch {}
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function currentItem() { return state.data.find(item => item.id === state.selectedId) || state.data[0]; }
    function isMobile() { return window.matchMedia('(max-width: 820px)').matches; }
    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove('show'), 1800);
    }

    function renderAccountAreas() {
      document.querySelectorAll('[data-account-area]').forEach(area => {
        const mobile = area.classList.contains('mobile-account');
        if (state.user) {
          area.innerHTML = mobile
            ? `${state.user.isAdmin ? '<button class="account-button" data-open-admin type="button" aria-label="邀请码管理">管理</button>' : ''}<button class="account-button" data-logout type="button">退出</button>`
            : `${state.user.isAdmin ? '<button class="account-button" data-open-admin type="button">邀请码管理</button>' : ''}<span class="account-user" title="${escapeHtml(state.user.username)}">${escapeHtml(state.user.username)}${state.user.isAdmin ? ' · 管理员' : ''}</span><button class="account-button" data-logout type="button">退出</button>`;
        } else {
          area.innerHTML = mobile
            ? '<button class="account-button" data-open-auth="login" type="button" aria-label="登录账号">登录</button>'
            : '<button class="account-button" data-open-auth="login" type="button">登录</button><button class="account-button primary" data-open-auth="register" type="button">注册</button>';
        }
      });
      updateMobileTopbarAction();
    }

    function updateMobileTopbarAction() {
      if (!isMobile()) return;
      const isDetail = state.view === 'detail';
      els.mobileStar.classList.toggle('hidden', !isDetail);
      document.querySelector('.mobile-topbar .mobile-account').style.display = isDetail ? 'none' : 'flex';
    }

    function setAuthMode(mode) {
      state.authMode = mode;
      document.querySelectorAll('[data-auth-mode]').forEach(button => button.classList.toggle('active', button.dataset.authMode === mode));
      document.getElementById('authTitle').textContent = mode === 'register' ? '创建账号' : '账号登录';
      document.getElementById('authDescription').textContent = state.pendingView === 'ai'
        ? '注册或登录后即可使用智能辨析。'
        : '登录后，学习进度会安全保存到你的账号。';
      document.getElementById('authSubmit').textContent = mode === 'register' ? '注册并保存进度' : '登录并同步';
      document.getElementById('authPassword').autocomplete = mode === 'register' ? 'new-password' : 'current-password';
      const inviteField = document.getElementById('inviteCodeField');
      const inviteInput = document.getElementById('authInviteCode');
      inviteField.hidden = mode !== 'register';
      inviteInput.required = mode === 'register';
      if (mode !== 'register') inviteInput.value = '';
      els.authMessage.textContent = '';
    }

    function openAuth(mode = 'login', pendingView = null) {
      state.pendingView = pendingView;
      setAuthMode(mode);
      els.authModal.classList.add('open');
      els.authModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => document.getElementById('authUsername').focus(), 0);
    }

    function closeAuth() {
      els.authModal.classList.remove('open');
      els.authModal.setAttribute('aria-hidden', 'true');
      els.authForm.reset();
      els.authMessage.textContent = '';
      state.pendingView = null;
    }

    async function submitAuth(form) {
      const submit = document.getElementById('authSubmit');
      submit.disabled = true;
      els.authMessage.textContent = '';
      try {
        const response = await fetch(`/api/auth/${state.authMode}`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            username: form.elements.username.value.trim(),
            password: form.elements.password.value,
            inviteCode: state.authMode === 'register' ? form.elements.inviteCode.value.trim() : undefined,
            localProgress: progressPayload()
          })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || '账号操作失败');
        state.user = payload.user;
        applyProgress(payload.progress);
        renderAccountAreas();
        const pendingView = state.pendingView;
        closeAuth();
        if (pendingView) setView(pendingView);
        showToast(state.authMode === 'register' ? '账号已创建，进度已保存' : '登录成功，进度已同步');
      } catch (error) {
        els.authMessage.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    }

    async function restoreSession() {
      try {
        const response = await fetch('/api/auth/me', {cache:'no-store'});
        const payload = await response.json();
        state.user = payload.user || null;
        state.guestAiUsed = Boolean(payload.guestTrialUsed);
        if (state.user && payload.progress) applyProgress(payload.progress);
      } catch {
        state.user = null;
      }
      renderAccountAreas();
    }

    async function logout() {
      try { await fetch('/api/auth/logout', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}); } catch {}
      state.user = null;
      state.adminInvites = []; state.generatedCodes = [];
      state.mastered = new Set(); state.saved = new Set(); state.wrong = new Set();
      localStorage.removeItem(STORAGE.mastered); localStorage.removeItem(STORAGE.saved); localStorage.removeItem(STORAGE.wrong);
      updateStats(); renderWordList(); renderAccountAreas(); setView('library');
      showToast('已退出账号');
    }

    function formatDate(timestamp) {
      if (!timestamp) return '长期有效';
      return new Intl.DateTimeFormat('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date(timestamp * 1000));
    }

    function inviteStatusText(invite) {
      return ({active:'有效', used:'已核销', expired:'已过期', revoked:'已撤销'})[invite.status] || invite.status;
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
        showToast('已复制');
      } catch {
        showToast('复制失败，请手动选择');
      }
    }

    async function loadAdminInvites() {
      if (!state.user?.isAdmin) return;
      try {
        const response = await fetch('/api/admin/invites', {cache:'no-store'});
        const payload = await response.json();
        if (response.status === 401 || response.status === 403) {
          state.user = null;
          renderAccountAreas();
          setView('library');
        }
        if (!response.ok) throw new Error(payload.error || '邀请码列表载入失败');
        state.adminInvites = payload.invites || [];
        if (state.view === 'admin') renderAdmin();
      } catch (error) {
        const status = document.getElementById('adminStatus');
        if (status) status.textContent = error.message;
      }
    }

    function normalizePhraseParts(value) {
      return String(value || '')
        .split(/\s*\/\s*|\s*[；;]\s*|\n+/)
        .map(part => part.trim())
        .filter(Boolean);
    }

    function answerGroups(answer) {
      return String(answer || '').split(/[，,]/).map(group =>
        group.split(/[\/／]/).map(option => option.trim()).filter(Boolean)
      ).filter(group => group.length);
    }

    function renderAnswerSequence(quiz, scope) {
      const groups = answerGroups(quiz.answer);
      if (groups.length < 2) return '';
      return `<div class="answer-sequence" data-answer-sequence>
        <span class="answer-sequence-label">依次作答</span>
        ${groups.map((group, index) => `<span class="answer-slot ${index === 0 ? 'active' : ''}" data-answer-slot="${index}">第 ${index + 1} 空</span>`).join('')}
        <button class="reset-answer" data-reset-${scope} type="button" hidden>重选</button>
      </div>`;
    }

    function updateAnswerSequence(container, selections, groups, answered) {
      const sequence = container.querySelector('[data-answer-sequence]');
      if (!sequence) return;
      sequence.querySelectorAll('[data-answer-slot]').forEach((slot, index) => {
        const value = selections[index];
        slot.textContent = value || `第 ${index + 1} 空`;
        slot.classList.toggle('filled', Boolean(value));
        slot.classList.toggle('active', !answered && index === selections.length);
        slot.classList.toggle('correct', answered && groups[index].includes(value));
        slot.classList.toggle('wrong', answered && !groups[index].includes(value));
      });
      const reset = sequence.querySelector('.reset-answer');
      if (reset) reset.hidden = selections.length === 0;
    }

    function updateStats() {
      const total = state.data.length;
      document.getElementById('libraryTotal').textContent = `${total} 组`;
    }

    function normalizeSearch(value) {
      return String(value || '')
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[\s'’·-]+/g, '');
    }

    function filteredItems() {
      const query = normalizeSearch(state.query);
      return state.data.filter(item => {
        if (state.filter === 'unmastered' && state.mastered.has(item.id)) return false;
        if (state.filter === 'mastered' && !state.mastered.has(item.id)) return false;
        if (state.filter === 'saved' && !state.saved.has(item.id)) return false;
        if (!query) return true;
        const text = normalizeSearch([item.words?.join(' '), item.pinyin].join(' '));
        return text.includes(query);
      });
    }

    function renderWordList(options = {}) {
      const previousScrollTop = els.wordList.scrollTop;
      const items = filteredItems();
      if (!items.length) {
        els.wordList.innerHTML = '<div class="list-empty">没有找到匹配的词组</div>';
        els.wordList.scrollTop = 0;
        return;
      }
      els.wordList.innerHTML = items.map(item => `
        <button class="word-item ${item.id === state.selectedId ? 'active' : ''}" type="button" data-id="${item.id}">
          <span class="word-name">${escapeHtml(item.words.join(' / '))}</span>
          <span class="word-state">${state.saved.has(item.id) ? '<svg class="mini-star"><use href="#i-star"></use></svg>' : ''}<span class="state-dot ${state.mastered.has(item.id) ? 'mastered' : ''}"></span></span>
        </button>`).join('');
      els.wordList.scrollTop = options.resetScroll ? 0 : previousScrollTop;
    }

    function renderCommon(item) {
      const common = item.common || {};
      const examples = Array.isArray(common.examples) ? common.examples.filter(Boolean) : [];
      return `<section class="content-section" id="section-common">
        <div class="section-heading"><h2>相同之处</h2></div>
        <div class="section-surface">
          <p class="common-copy">${escapeHtml(common.meaning || '暂无说明')}</p>
          ${examples.length ? `<div class="common-examples">${examples.map(text => `<p class="example-line">${escapeHtml(text)}</p>`).join('')}</div>` : ''}
        </div>
      </section>`;
    }

    function renderContrast(item) {
      const parts = item.contrast || [];
      const columns = Math.min(parts.length, 3);
      return `<section class="content-section" id="section-contrast">
        <div class="section-heading"><h2>不同之处</h2></div>
        <div class="contrast-grid" style="--contrast-columns:${columns}">${parts.map((part, index) => `
          <article class="contrast-card">
            <div class="contrast-head"><h3 class="contrast-word">${escapeHtml(part.word)}</h3><span class="contrast-order">0${index + 1}</span></div>
            <p class="contrast-meaning">${escapeHtml(part.meaning)}</p>
            ${(part.examples || []).length ? `<div class="contrast-examples">${part.examples.map(example => `<p class="contrast-example">${escapeHtml(example)}</p>`).join('')}</div>` : ''}
          </article>`).join('')}</div>
      </section>`;
    }

    function renderCollocations(item) {
      const rows = [];
      const commonParts = normalizePhraseParts(item.common?.collocations);
      if (commonParts.length) rows.push({label: '共同搭配', parts: commonParts});
      (item.contrast || []).forEach(part => {
        const parts = normalizePhraseParts(part.collocations);
        if (parts.length) rows.push({label: part.word, parts});
      });
      if (Array.isArray(item.collocations) && item.collocations.length) rows.push({label: '常见组合', parts: item.collocations});
      return `<section class="content-section" id="section-collocations">
        <div class="section-heading"><h2>常见组合</h2></div>
        ${rows.length ? `<div class="collocation-stack">${rows.map(row => `
          <div class="collocation-row"><div class="collocation-label">${escapeHtml(row.label)}</div><div class="phrase-grid">${row.parts.map(part => `<span class="phrase-chip">${escapeHtml(part)}</span>`).join('')}</div></div>`).join('')}</div>` : '<div class="collocation-empty">该词组暂未收录固定组合</div>'}
      </section>`;
    }

    function quizKey(itemId, quizIndex) { return `${itemId}:${quizIndex}`; }
    function renderQuizzes(item) {
      const quizzes = item.quizzes || [];
      return `<section class="content-section" id="section-quizzes">
        <div class="section-heading"><h2>巩固练习</h2></div>
        <div class="quiz-list">${quizzes.map((quiz, index) => `
          <article class="quiz-card" data-quiz-index="${index}">
            <div class="quiz-topline"><span class="quiz-number">练习 ${String(index + 1).padStart(2, '0')}</span><span class="quiz-status">${answerGroups(quiz.answer).length > 1 ? `请依次选择 ${answerGroups(quiz.answer).length} 个空` : '选择答案后显示解析'}</span></div>
            <p class="quiz-question">${escapeHtml(quiz.question.replace(/^\d+\.\s*/, ''))}</p>
            ${renderAnswerSequence(quiz, 'detail')}
            <div class="quiz-options">${quiz.options.map(option => `<button class="quiz-option" type="button" data-option="${escapeHtml(option)}">${escapeHtml(option)}</button>`).join('')}</div>
            <div class="quiz-answer"><strong>参考答案：${escapeHtml(quiz.answer)}</strong><br>${escapeHtml(quiz.explanation)}</div>
          </article>`).join('')}</div>
      </section>`;
    }

    function renderDetail() {
      const item = currentItem();
      if (!item) return;
      state.selectedId = item.id;
      els.crumb.textContent = item.words.join(' / ');
      els.mobileTitle.textContent = item.words.join(' / ');
      const isSaved = state.saved.has(item.id);
      const isMastered = state.mastered.has(item.id);
      els.starButton.classList.toggle('active', isSaved);
      els.mobileStar.classList.toggle('active', isSaved);
      els.mobileStar.querySelector('use').setAttribute('href', '#i-star');
      els.masterButton.classList.toggle('active', isMastered);
      els.masterButton.querySelector('span').textContent = isMastered ? '已掌握' : '标记已掌握';
      els.content.innerHTML = `<article class="detail-view">
        <header class="word-hero"><p class="eyebrow">第 ${String(item.id).padStart(3,'0')} 组</p><h1 class="word-title">${escapeHtml(item.words.join(' · '))}</h1><p class="word-pinyin">${escapeHtml(item.pinyin)}</p><span class="word-category">${escapeHtml(item.category)}</span></header>
        <nav class="jump-tabs" aria-label="词条内容导航">
          <button class="jump-tab active" data-target="section-common" type="button">相同之处</button>
          <button class="jump-tab" data-target="section-contrast" type="button">不同之处</button>
          <button class="jump-tab" data-target="section-collocations" type="button">常见组合</button>
          <button class="jump-tab" data-target="section-quizzes" type="button">巩固练习</button>
        </nav>
        ${renderCommon(item)}${renderContrast(item)}${renderCollocations(item)}${renderQuizzes(item)}
      </article>`;
      els.content.scrollTop = 0;
    }

    function buildPracticePool(type = 'all') {
      const pool = [];
      state.data.forEach(item => (item.quizzes || []).forEach((quiz, index) => {
        const key = quizKey(item.id, index);
        if (type === 'wrong' && !state.wrong.has(key)) return;
        if (type === 'unmastered' && state.mastered.has(item.id)) return;
        pool.push({item, quiz, index, key});
      }));
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      state.practicePool = pool;
      state.practicePage = 0;
      state.practiceFilter = type;
    }

    function renderPracticeCard(entry, visibleIndex) {
      const groups = answerGroups(entry.quiz.answer);
      return `<article class="practice-card" data-practice-key="${entry.key}" data-item-id="${entry.item.id}" data-quiz-index="${entry.index}">
        <div class="quiz-topline"><span class="practice-source">${escapeHtml(entry.item.words.join(' / '))}</span><span class="quiz-status">${groups.length > 1 ? `请依次选择 ${groups.length} 个空` : '选择答案后显示解析'}</span></div>
        <div class="practice-progress">本组第 ${visibleIndex + 1} 题</div>
        <h2 class="practice-question">${escapeHtml(entry.quiz.question.replace(/^\d+\.\s*/, ''))}</h2>
        ${renderAnswerSequence(entry.quiz, 'practice')}
        <div class="quiz-options">${entry.quiz.options.map(option => `<button class="quiz-option" type="button" data-practice-option="${escapeHtml(option)}">${escapeHtml(option)}</button>`).join('')}</div>
        <div class="quiz-answer"><strong>参考答案：${escapeHtml(entry.quiz.answer)}</strong><br>${escapeHtml(entry.quiz.explanation)}</div>
      </article>`;
    }

    function renderPractice() {
      if (!state.practicePool.length && state.practiceFilter === 'all') buildPracticePool('all');
      const pageSize = 20;
      const totalPages = Math.max(1, Math.ceil(state.practicePool.length / pageSize));
      state.practicePage = Math.min(state.practicePage, totalPages - 1);
      const pageStart = state.practicePage * pageSize;
      const pageItems = state.practicePool.slice(pageStart, pageStart + pageSize);
      const filters = `<div class="practice-filter">
        <button class="filter-chip ${state.practiceFilter === 'all' ? 'active' : ''}" data-practice-filter="all" type="button">全部题目</button>
        <button class="filter-chip ${state.practiceFilter === 'wrong' ? 'active' : ''}" data-practice-filter="wrong" type="button">错题复习</button>
        <button class="filter-chip ${state.practiceFilter === 'unmastered' ? 'active' : ''}" data-practice-filter="unmastered" type="button">待掌握词组</button>
      </div>`;
      els.crumb.textContent = '专注练习';
      els.mobileTitle.textContent = '专注练习';
      els.mobileStar.classList.add('hidden');
      if (!pageItems.length) {
        els.content.innerHTML = `<section class="practice-view"><header class="view-header"><h1>专注练习</h1><p>每组直接呈现 20 题，答错的题会自动加入复习池。</p></header>${filters}<div class="empty-state"><svg class="icon"><use href="#i-inbox"></use></svg>当前题库没有可练习的题目</div></section>`;
        return;
      }
      els.content.innerHTML = `<section class="practice-view">
        <header class="view-header"><h1>专注练习</h1><p>每组直接呈现 20 题，答错的题会自动加入复习池。</p></header>
        ${filters}
        <div class="practice-set">${pageItems.map((entry, index) => renderPracticeCard(entry, index)).join('')}</div>
        <div class="practice-set-actions"><span class="practice-set-meta">第 ${state.practicePage + 1} / ${totalPages} 组 · 共 ${state.practicePool.length} 题</span><span><button class="text-button" data-practice-page="prev" type="button" ${state.practicePage === 0 ? 'disabled' : ''}>上一组</button> <button class="text-button primary" data-practice-page="next" type="button" ${state.practicePage >= totalPages - 1 ? 'disabled' : ''}>下一组 20 题</button></span></div>
      </section>`;
      els.content.scrollTop = 0;
    }

    function renderAi() {
      els.crumb.textContent = '智能辨析';
      els.mobileTitle.textContent = '智能辨析';
      els.mobileStar.classList.add('hidden');
      els.content.innerHTML = `<section class="ai-view">
        <header class="view-header"><h1>智能辨析</h1><p>输入 2 至 4 个近义词，获取针对用法、语体和语境的辨析建议。</p></header>
        <form class="ai-form" id="aiForm">
          <div class="ai-field"><label for="aiWords">需要辨析的词语</label><input class="ai-input" id="aiWords" name="words" maxlength="80" autocomplete="off" placeholder="例如：爱好、嗜好" required></div>
          <div class="ai-field"><label for="aiContext">使用语境（可选）</label><textarea class="ai-textarea" id="aiContext" name="context" maxlength="500" placeholder="可输入句子、写作场景或你不确定的用法"></textarea></div>
          <div class="ai-form-footer"><span class="ai-hint">请求由服务端安全转发，访问密钥不会发送到浏览器。</span><button class="ai-submit" id="aiSubmit" type="submit"><svg class="icon"><use href="#i-sparkles"></use></svg><span>开始辨析</span></button></div>
        </form>
        <div id="aiResult" aria-live="polite"></div>
      </section>`;
      els.content.scrollTop = 0;
    }

    function renderAdmin() {
      if (!state.user?.isAdmin) {
        setView('library');
        return;
      }
      const activeCount = state.adminInvites.filter(invite => invite.status === 'active').length;
      const usedCount = state.adminInvites.filter(invite => invite.status === 'used').length;
      const generated = state.generatedCodes.length ? `<section class="generated-batch">
        <div class="generated-head"><div><h2>本次生成的邀请码</h2><p class="invite-summary">明文只显示本次，请立即分发或保存。</p></div><button class="text-button" data-copy-all-codes type="button">复制全部</button></div>
        <div class="generated-codes">${state.generatedCodes.map(code => `<div class="generated-code"><code>${escapeHtml(code)}</code><button class="mini-icon-button" data-copy-code="${escapeHtml(code)}" type="button" aria-label="复制邀请码" title="复制"><svg class="icon"><use href="#i-copy"></use></svg></button></div>`).join('')}</div>
      </section>` : '';
      const rows = state.adminInvites.map(invite => `<div class="invite-row">
        <span class="invite-status ${escapeHtml(invite.status)}">${inviteStatusText(invite)}</span>
        <span class="invite-label" title="${escapeHtml(invite.label || '未命名批次')}">${escapeHtml(invite.label || '未命名批次')} · #${invite.id}</span>
        <span class="invite-meta">生成：${formatDate(invite.createdAt)}</span>
        <span class="invite-meta">${invite.status === 'used' ? `用户：${escapeHtml(invite.usedBy || '账号已删除')}` : `到期：${formatDate(invite.expiresAt)}`}</span>
        ${invite.status === 'active' ? `<button class="invite-action" data-revoke-invite="${invite.id}" type="button">撤销</button>` : '<span></span>'}
      </div>`).join('');
      els.crumb.textContent = '邀请码管理';
      els.mobileTitle.textContent = '邀请码管理';
      els.mobileStar.classList.add('hidden');
      els.content.innerHTML = `<section class="admin-view">
        <header class="view-header"><h1>邀请码管理</h1><p>批量生成固定格式的一次性邀请码。默认自生成之日起 60 天内有效，注册成功后立即核销。</p></header>
        <section class="admin-controls"><form class="admin-form" id="adminInviteForm">
          <div class="admin-field"><label for="inviteCount">生成数量</label><input class="admin-input" id="inviteCount" name="count" type="number" min="1" max="100" value="10" required></div>
          <div class="admin-field"><label for="inviteValidDays">有效天数</label><input class="admin-input" id="inviteValidDays" name="validDays" type="number" min="1" max="3650" value="60" required></div>
          <div class="admin-field wide"><label for="inviteLabel">批次名称</label><input class="admin-input" id="inviteLabel" name="label" maxlength="80" placeholder="例如：2026 秋季第一批"></div>
          <button class="admin-submit" id="adminInviteSubmit" type="submit"><svg class="icon"><use href="#i-key"></use></svg><span>生成邀请码</span></button>
        </form><p class="auth-message" id="adminStatus" role="status"></p></section>
        ${generated}
        <section><div class="invite-list-head"><div><h2>邀请码记录</h2><p class="invite-summary">有效 ${activeCount} 个 · 已核销 ${usedCount} 个 · 最近 ${state.adminInvites.length} 条</p></div><button class="text-button" data-refresh-invites type="button">刷新</button></div>
          <div class="invite-list">${rows || '<div class="empty-state">尚未生成邀请码</div>'}</div>
        </section>
      </section>`;
      els.content.scrollTop = 0;
    }

    async function submitAdminInviteForm(form) {
      const submit = document.getElementById('adminInviteSubmit');
      const status = document.getElementById('adminStatus');
      submit.disabled = true;
      status.textContent = '';
      try {
        const response = await fetch('/api/admin/invites', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({count: Number(form.elements.count.value), validDays: Number(form.elements.validDays.value), label: form.elements.label.value.trim()})
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || '邀请码生成失败');
        state.generatedCodes = payload.codes || [];
        await loadAdminInvites();
        showToast(`已生成 ${state.generatedCodes.length} 个邀请码`);
      } catch (error) {
        status.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    }

    async function revokeAdminInvite(id) {
      try {
        const response = await fetch('/api/admin/invites/revoke', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:Number(id)})});
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || '邀请码撤销失败');
        await loadAdminInvites();
        showToast('邀请码已撤销');
      } catch (error) {
        showToast(error.message);
      }
    }

    function renderSaved() {
      const items = state.data.filter(item => state.saved.has(item.id));
      els.crumb.textContent = '我的收藏';
      els.mobileTitle.textContent = '我的收藏';
      els.mobileStar.classList.add('hidden');
      els.content.innerHTML = `<section class="saved-view"><header class="view-header"><h1>我的收藏</h1><p>集中复习需要反复辨析的词组。</p></header>
        ${items.length ? `<div class="saved-list">${items.map(item => `<button class="saved-item" data-saved-id="${item.id}" type="button"><span><h3>${escapeHtml(item.words.join(' / '))}</h3><p>${escapeHtml(item.pinyin)} · ${escapeHtml(item.category)}</p></span><svg class="icon"><use href="#i-back"></use></svg></button>`).join('')}</div>` : '<div class="empty-state"><svg class="icon"><use href="#i-star"></use></svg>还没有收藏词组<br>在词条右上角点击星标即可收藏</div>'}
      </section>`;
      els.content.scrollTop = 0;
    }

    function setView(view, options = {}) {
      if (view === 'admin' && !state.user?.isAdmin) {
        showToast('仅管理员可以管理邀请码');
        return;
      }
      state.view = view;
      document.querySelector('.toolbar-actions').classList.toggle('is-hidden', !['library', 'detail'].includes(view));
      document.querySelectorAll('[data-view]').forEach(button => button.classList.toggle('active', button.dataset.view === view || (view === 'detail' && button.dataset.view === 'library')));
      if (isMobile()) document.body.dataset.mobileView = view === 'library' ? 'library' : view;
      if (view === 'library') {
        if (isMobile()) return;
        renderDetail();
      } else if (view === 'detail') {
        els.mobileStar.classList.remove('hidden');
        renderDetail();
      } else if (view === 'practice') {
        renderPractice();
      } else if (view === 'ai') {
        renderAi();
      } else if (view === 'saved') {
        renderSaved();
      } else if (view === 'admin') {
        renderAdmin();
        loadAdminInvites();
      }
      updateMobileTopbarAction();
      if (!options.keepScroll) els.content.scrollTop = 0;
    }

    function selectItem(id) {
      const nextId = Number(id);
      if (nextId === state.selectedId && state.view === 'detail') return;
      const listScrollTop = els.wordList.scrollTop;
      const previousButton = els.wordList.querySelector(`.word-item[data-id="${state.selectedId}"]`);
      const nextButton = els.wordList.querySelector(`.word-item[data-id="${nextId}"]`);
      previousButton?.classList.remove('active');
      nextButton?.classList.add('active');
      state.selectedId = nextId;
      setView('detail');
      els.wordList.scrollTop = listScrollTop;
      requestAnimationFrame(() => { els.wordList.scrollTop = listScrollTop; });
    }

    function toggleSaved() {
      const item = currentItem();
      if (!item) return;
      if (state.saved.has(item.id)) { state.saved.delete(item.id); showToast('已取消收藏'); }
      else { state.saved.add(item.id); showToast('已加入收藏'); }
      saveState(); updateStats(); renderWordList();
      if (state.view === 'saved') renderSaved(); else renderDetail();
    }

    function toggleMastered() {
      const item = currentItem();
      if (!item) return;
      if (state.mastered.has(item.id)) { state.mastered.delete(item.id); showToast('已改为待掌握'); }
      else { state.mastered.add(item.id); showToast('已标记为掌握'); }
      saveState(); updateStats(); renderWordList(); renderDetail();
    }

    function answerDetailQuiz(card, option) {
      if (card.dataset.answered) return;
      const item = currentItem();
      const index = Number(card.dataset.quizIndex);
      const quiz = item.quizzes[index];
      const groups = answerGroups(quiz.answer);
      const selections = JSON.parse(card.dataset.selections || '[]');
      selections.push(option);
      card.dataset.selections = JSON.stringify(selections);
      updateAnswerSequence(card, selections, groups, false);
      if (selections.length < groups.length) {
        card.querySelector('.quiz-status').textContent = `接着选择第 ${selections.length + 1} 空`;
        return;
      }
      const correct = groups.every((group, groupIndex) => group.includes(selections[groupIndex]));
      card.dataset.answered = 'true';
      card.classList.add(correct ? 'answered-correct' : 'answered-wrong');
      card.querySelectorAll('.quiz-option').forEach(button => {
        button.disabled = true;
        if (groups.length === 1 && groups[0].includes(button.dataset.option)) button.classList.add('correct');
        else if (groups.length === 1 && button.dataset.option === option) button.classList.add('wrong');
      });
      updateAnswerSequence(card, selections, groups, true);
      card.querySelector('.quiz-status').textContent = correct ? '回答正确' : '已加入错题';
      card.querySelector('.quiz-answer').classList.add('show');
      const key = quizKey(item.id, index);
      if (correct) state.wrong.delete(key); else state.wrong.add(key);
      saveState(); updateStats();
      recordAttempt(item.id, index, selections, correct);
    }

    function answerPractice(card, option) {
      if (card.dataset.answered) return;
      const item = state.data.find(entry => entry.id === Number(card.dataset.itemId));
      const quizIndex = Number(card.dataset.quizIndex);
      const quiz = item?.quizzes?.[quizIndex];
      if (!quiz) return;
      const groups = answerGroups(quiz.answer);
      const selections = JSON.parse(card.dataset.selections || '[]');
      selections.push(option);
      card.dataset.selections = JSON.stringify(selections);
      updateAnswerSequence(card, selections, groups, false);
      if (selections.length < groups.length) {
        card.querySelector('.quiz-status').textContent = `接着选择第 ${selections.length + 1} 空`;
        return;
      }
      const correct = groups.every((group, groupIndex) => group.includes(selections[groupIndex]));
      card.dataset.answered = 'true';
      card.classList.add(correct ? 'answered-correct' : 'answered-wrong');
      card.querySelectorAll('[data-practice-option]').forEach(button => {
        button.disabled = true;
        if (groups.length === 1 && groups[0].includes(button.dataset.practiceOption)) button.classList.add('correct');
        else if (groups.length === 1 && button.dataset.practiceOption === option) button.classList.add('wrong');
      });
      updateAnswerSequence(card, selections, groups, true);
      card.querySelector('.quiz-status').textContent = correct ? '回答正确' : '已加入错题';
      card.querySelector('.quiz-answer').classList.add('show');
      const key = quizKey(item.id, quizIndex);
      if (correct) state.wrong.delete(key); else state.wrong.add(key);
      saveState(); updateStats();
      recordAttempt(item.id, quizIndex, selections, correct);
    }

    function resetDetailQuiz(card) {
      const item = currentItem();
      const quiz = item.quizzes[Number(card.dataset.quizIndex)];
      delete card.dataset.answered;
      delete card.dataset.selections;
      card.classList.remove('answered-correct', 'answered-wrong');
      card.querySelectorAll('.quiz-option').forEach(button => {
        button.disabled = false;
        button.classList.remove('correct', 'wrong');
      });
      card.querySelector('.quiz-answer').classList.remove('show');
      card.querySelector('.quiz-status').textContent = answerGroups(quiz.answer).length > 1 ? `请依次选择 ${answerGroups(quiz.answer).length} 个空` : '选择答案后显示解析';
      updateAnswerSequence(card, [], answerGroups(quiz.answer), false);
    }

    function resetPracticeQuiz(card) {
      const item = state.data.find(entry => entry.id === Number(card.dataset.itemId));
      const quiz = item?.quizzes?.[Number(card.dataset.quizIndex)];
      if (!quiz) return;
      delete card.dataset.answered;
      delete card.dataset.selections;
      card.classList.remove('answered-correct', 'answered-wrong');
      card.querySelectorAll('[data-practice-option]').forEach(button => {
        button.disabled = false;
        button.classList.remove('correct', 'wrong');
      });
      card.querySelector('.quiz-answer').classList.remove('show');
      card.querySelector('.quiz-status').textContent = answerGroups(quiz.answer).length > 1 ? `请依次选择 ${answerGroups(quiz.answer).length} 个空` : '选择答案后显示解析';
      updateAnswerSequence(card, [], answerGroups(quiz.answer), false);
    }

    async function submitAiForm(form) {
      if (!state.user && state.guestAiUsed) {
        openAuth('login', 'ai');
        showToast('免费体验已使用，请登录后继续');
        return;
      }
      const words = form.elements.words.value.trim();
      const context = form.elements.context.value.trim();
      const submit = document.getElementById('aiSubmit');
      const result = document.getElementById('aiResult');
      const wordParts = words.split(/[、，,\/\s]+/).filter(Boolean);
      if (wordParts.length < 2 || wordParts.length > 4) {
        result.innerHTML = '<div class="ai-result ai-error"><h2>输入有误</h2><p class="ai-result-copy">请输入 2 至 4 个需要辨析的词语。</p></div>';
        return;
      }
      submit.disabled = true;
      submit.querySelector('span').textContent = '正在辨析';
      result.innerHTML = '<div class="ai-result"><p class="ai-result-copy">正在整理词义、语体和使用语境，请稍候……</p></div>';
      try {
        const response = await fetch('/api/synonym-analysis', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({words: wordParts, context})
        });
        const payload = await response.json();
        if (response.status === 401) {
          state.user = null;
          state.guestAiUsed = true;
          renderAccountAreas();
          openAuth('login', 'ai');
        }
        if (!response.ok) throw new Error(payload.error || '智能辨析暂时不可用');
        if (!state.user && payload.guestTrialUsed) state.guestAiUsed = true;
        result.innerHTML = '<div class="ai-result"><h2>辨析结果</h2><p class="ai-result-copy"></p></div>';
        result.querySelector('.ai-result-copy').textContent = payload.analysis;
      } catch (error) {
        result.innerHTML = '<div class="ai-result ai-error"><h2>请求未完成</h2><p class="ai-result-copy"></p></div>';
        result.querySelector('.ai-result-copy').textContent = error.message;
      } finally {
        submit.disabled = false;
        submit.querySelector('span').textContent = '开始辨析';
      }
    }

    document.addEventListener('click', event => {
      const openAuthButton = event.target.closest('[data-open-auth]');
      if (openAuthButton) { openAuth(openAuthButton.dataset.openAuth); return; }
      if (event.target.closest('[data-open-admin]')) { setView('admin'); return; }
      if (event.target.closest('[data-logout]')) { logout(); return; }
      const authMode = event.target.closest('[data-auth-mode]');
      if (authMode) { setAuthMode(authMode.dataset.authMode); return; }
      if (event.target.closest('#authClose') || event.target === els.authModal) { closeAuth(); return; }
      const viewButton = event.target.closest('[data-view]');
      if (viewButton) { setView(viewButton.dataset.view); return; }
      const wordButton = event.target.closest('.word-item');
      if (wordButton) { selectItem(wordButton.dataset.id); return; }
      const filter = event.target.closest('[data-filter]');
      if (filter) {
        state.filter = filter.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(button => button.classList.toggle('active', button === filter));
        renderWordList({resetScroll:true}); return;
      }
      const jump = event.target.closest('.jump-tab');
      if (jump) {
        document.querySelectorAll('.jump-tab').forEach(button => button.classList.toggle('active', button === jump));
        document.getElementById(jump.dataset.target)?.scrollIntoView({behavior:'smooth', block:'start'}); return;
      }
      const detailOption = event.target.closest('.quiz-card .quiz-option');
      if (detailOption) { answerDetailQuiz(detailOption.closest('.quiz-card'), detailOption.dataset.option); return; }
      const practiceOption = event.target.closest('[data-practice-option]');
      if (practiceOption) { answerPractice(practiceOption.closest('.practice-card'), practiceOption.dataset.practiceOption); return; }
      const resetDetail = event.target.closest('[data-reset-detail]');
      if (resetDetail) { resetDetailQuiz(resetDetail.closest('.quiz-card')); return; }
      const resetPractice = event.target.closest('[data-reset-practice]');
      if (resetPractice) { resetPracticeQuiz(resetPractice.closest('.practice-card')); return; }
      const practiceFilter = event.target.closest('[data-practice-filter]');
      if (practiceFilter) {
        buildPracticePool(practiceFilter.dataset.practiceFilter);
        renderPractice(); return;
      }
      const savedItem = event.target.closest('[data-saved-id]');
      if (savedItem) { selectItem(savedItem.dataset.savedId); return; }
      const practicePage = event.target.closest('[data-practice-page]');
      if (practicePage && !practicePage.disabled) {
        state.practicePage += practicePage.dataset.practicePage === 'next' ? 1 : -1;
        renderPractice(); return;
      }
      const copyCode = event.target.closest('[data-copy-code]');
      if (copyCode) { copyText(copyCode.dataset.copyCode); return; }
      if (event.target.closest('[data-copy-all-codes]')) { copyText(state.generatedCodes.join('\n')); return; }
      if (event.target.closest('[data-refresh-invites]')) { loadAdminInvites(); return; }
      const revokeInvite = event.target.closest('[data-revoke-invite]');
      if (revokeInvite) { revokeAdminInvite(revokeInvite.dataset.revokeInvite); return; }
    });

    document.addEventListener('submit', event => {
      if (event.target.matches('#authForm')) {
        event.preventDefault();
        submitAuth(event.target); return;
      }
      if (event.target.matches('#aiForm')) {
        event.preventDefault();
        submitAiForm(event.target);
        return;
      }
      if (event.target.matches('#adminInviteForm')) {
        event.preventDefault();
        submitAdminInviteForm(event.target);
      }
    });

    els.searchInput.addEventListener('input', () => {
      state.query = els.searchInput.value;
      els.clearSearch.classList.toggle('show', Boolean(state.query));
      renderWordList({resetScroll:true});
    });
    els.clearSearch.addEventListener('click', () => {
      els.searchInput.value = ''; state.query = ''; els.clearSearch.classList.remove('show'); renderWordList({resetScroll:true}); els.searchInput.focus();
    });
    els.starButton.addEventListener('click', toggleSaved);
    els.mobileStar.addEventListener('click', toggleSaved);
    els.masterButton.addEventListener('click', toggleMastered);
    document.getElementById('mobileBack').addEventListener('click', () => setView('library'));
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && els.authModal.classList.contains('open')) closeAuth(); });

    window.addEventListener('resize', () => {
      if (!isMobile()) {
        document.body.dataset.mobileView = 'library';
        if (state.view === 'library' || state.view === 'detail') renderDetail();
      } else {
        document.body.dataset.mobileView = state.view === 'library' ? 'library' : state.view;
      }
    });

    async function loadDictionary() {
      let indexLoaded = false;
      const fullDictionaryRequest = fetch('./dictionary.json');
      try {
        const indexResponse = await fetch('./dictionary_index.json');
        if (!indexResponse.ok) throw new Error(`HTTP ${indexResponse.status}`);
        const index = await indexResponse.json();
        if (!Array.isArray(index) || !index.length) throw new Error('词库目录为空');
        state.data = index;
        state.selectedId = index[0].id;
        indexLoaded = true;
        updateStats(); renderWordList(); renderDetail();
        const loadingCopy = els.loading.querySelector('span');
        if (loadingCopy) loadingCopy.textContent = '词库目录已就绪，正在载入完整内容';
      } catch {}

      try {
        const response = await fullDictionaryRequest;
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data) || !data.length) throw new Error('词库为空');
        state.data = data;
        state.dictionaryReady = true;
        if (!state.selectedId || !data.some(item => item.id === state.selectedId)) state.selectedId = data[0].id;
        updateStats(); renderWordList();
        if (state.view === 'library' || state.view === 'detail') renderDetail();
        else if (state.view === 'saved') renderSaved();
        else if (state.view === 'practice') { buildPracticePool(state.practiceFilter); renderPractice(); }
        els.loading.style.display = 'none';
      } catch (error) {
        if (indexLoaded) {
          els.loading.innerHTML = `<div class="loading-box"><strong>完整词条载入失败</strong><br><span>${escapeHtml(error.message)}，请刷新后重试。</span></div>`;
        } else {
          els.loading.innerHTML = `<div class="loading-box"><strong>词库载入失败</strong><br><span>${escapeHtml(error.message)}。请通过本地服务器打开本页面。</span></div>`;
        }
      }
    }
    renderAccountAreas();
    Promise.all([loadDictionary(), restoreSession()]);
  </script>
</body>
</html>
